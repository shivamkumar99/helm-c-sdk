# Builds and attaches prebuilt libraries for every tagged release.
# Assumes helm-c is the repository root (see docs/BUILD.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: libhelm_c.so
            platform: linux-amd64
          - os: macos-latest
            artifact: libhelm_c.dylib
            platform: darwin-arm64
          - os: windows-latest
            artifact: helm_c.dll
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mingw-w64 (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y
      - name: Test
        run: go test -race ./...
      - name: Build
        run: make build
      - name: Generate pkg-config file
        shell: bash
        run: make pkgconfig VERSION=${GITHUB_REF_NAME#v}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/helm-c-${{ matrix.platform }}
          cp build/${{ matrix.artifact }} include/helm_c.h build/helm_c.pc \
             docs/API.md docs/MEMORY.md dist/helm-c-${{ matrix.platform }}/
          tar -C dist -czf dist/helm-c-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz \
             helm-c-${{ matrix.platform }}
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/helm-c-*.tar.gz
