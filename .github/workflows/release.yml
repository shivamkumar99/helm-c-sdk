# Release pipeline. Two triggers:
#   - pushing a tag v* releases that tag;
#   - workflow_dispatch releases ANY branch: pick the branch in the Actions UI,
#     supply a version — the release (and tag) is created from that ref.
# Pipeline: build (3 OS) → virus scan + checksums → publish. Binaries are only
# attached to a release after ClamAV passes over every artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0-rc.1); the tag is created from the selected branch"
        required: true

permissions:
  contents: write

env:
  REL_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install mingw-w64 (Windows)
        if: runner.os == 'Windows'
        # mingw 16.x ships binutils whose ld rejects Go's generated export_file.def
        # (c-shared DLL link fails with "syntax error"); pin the known-good release.
        run: choco install mingw --version=13.2.0 --allow-downgrade -y
      - name: Put pinned mingw first on PATH (Windows)
        if: runner.os == 'Windows'
        # The runner image preinstalls a newer mingw at C:\mingw64 which would
        # otherwise shadow the pinned one (GITHUB_PATH entries are prepended).
        shell: bash
        run: |
          for d in "/c/ProgramData/mingw64/mingw64/bin" \
                   "/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin"; do
            if [ -x "$d/gcc.exe" ]; then
              cygpath -w "$d" >> "$GITHUB_PATH"
              "$d/gcc.exe" --version | head -1
              exit 0
            fi
          done
          echo "pinned mingw gcc not found" >&2
          exit 1
      - name: Test
        run: go test -race ./...
      - name: Build (versioned library)
        shell: bash
        run: make build VERSION=${REL_VERSION#v}
      - name: Generate pkg-config file
        shell: bash
        run: make pkgconfig VERSION=${REL_VERSION#v}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/helm-c-${{ matrix.platform }}
          # -a preserves the soname symlink chain (Linux/macOS); Windows ships
          # the versioned DLL plus the unversioned linking copy.
          cp -a build/libhelm_c* dist/helm-c-${{ matrix.platform }}/
          cp include/helm_c.h build/helm_c.pc \
             docs/API.md docs/MEMORY.md LICENSE NOTICE dist/helm-c-${{ matrix.platform }}/
          tar -C dist -czf "dist/helm-c-${REL_VERSION}-${{ matrix.platform }}.tar.gz" \
             helm-c-${{ matrix.platform }}
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/helm-c-*.tar.gz
          if-no-files-found: error

  scan:
    # Malware scan of every release binary BEFORE anything is published.
    # A ClamAV finding fails the pipeline and nothing gets attached.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 # for SBOM generation over the source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Install ClamAV and refresh signatures
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clamav
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || sudo freshclam
      - name: Scan release artifacts (archives + extracted contents)
        run: |
          mkdir -p extracted scan
          for t in dist/*.tar.gz; do tar -xzf "$t" -C extracted; done
          clamscan -r --infected dist/ extracted/ | tee scan/clamav.txt
      - name: Stage standalone libraries + header for direct download
        # Besides the tarballs, attach each platform's library and the C
        # header as individual release assets, so consumers can grab exactly
        # the .so/.dylib/.dll + helm_c.h they need without unpacking.
        run: |
          VER=${REL_VERSION#v}
          cp "extracted/helm-c-linux-amd64/libhelm_c.so.${VER}" "dist/libhelm_c-${VER}-linux-amd64.so"
          cp "extracted/helm-c-darwin-arm64/libhelm_c.${VER}.dylib" "dist/libhelm_c-${VER}-darwin-arm64.dylib"
          cp "extracted/helm-c-windows-amd64/libhelm_c.dll" "dist/libhelm_c-${VER}-windows-amd64.dll"
          cp include/helm_c.h dist/helm_c.h
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/helm-c-sdk.sbom.spdx.json
          upload-artifact: false
      - name: Generate SHA-256 checksums (archives + standalone assets)
        run: |
          cd dist && sha256sum *.tar.gz *.so *.dylib *.dll helm_c.h > sha256sums.txt \
            && cat sha256sums.txt
      - name: Upload scanned artifacts + checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-scanned
          path: |
            dist/*.tar.gz
            dist/*.so
            dist/*.dylib
            dist/*.dll
            dist/helm_c.h
            dist/sha256sums.txt
            dist/helm-c-sdk.sbom.spdx.json
            scan/clamav.txt
          if-no-files-found: error

  publish:
    # Only runs when the scan job passed.
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-scanned
          path: release
      - name: Create release with binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.REL_VERSION }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          generate_release_notes: true
          files: |
            release/dist/*.tar.gz
            release/dist/*.so
            release/dist/*.dylib
            release/dist/*.dll
            release/dist/helm_c.h
            release/dist/sha256sums.txt
            release/dist/helm-c-sdk.sbom.spdx.json
            release/scan/clamav.txt
