# CI for helm-c. Assumes this folder is the repository root (see docs/BUILD.md).
# Every PR must build the shared library, pass -race tests, and run the C
# harness on Linux, macOS, AND Windows. Every job uploads its report as an
# artifact (and SARIF to the Security tab where applicable) for post-run review.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install mingw-w64 (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y
      - name: Format check
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit + boundary tests (-race, with report)
        shell: bash
        run: |
          mkdir -p reports
          go test -race -v ./... 2>&1 | tee reports/test-results.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Coverage report
        shell: bash
        run: |
          go test -coverprofile=reports/coverage.out ./internal/... ./capi/...
          go tool cover -func=reports/coverage.out | tee reports/coverage-summary.txt
      - name: Build shared library
        run: make build
      - name: E2E C harness
        if: runner.os != 'Windows'
        shell: bash
        run: make harness 2>&1 | tee reports/harness.txt
      - name: E2E C harness (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gcc -Wall -Wextra -Werror -o build/harness.exe test/c-harness/main.c \
            -I include -L build -lhelm_c
          HELMC_TESTCHART=testdata/testchart \
          HELMC_KUBECONFIG=testdata/kubeconfig.yaml \
          HELMC_SIGNING_DIR=testdata/signing \
          PATH="$PWD/build:$PATH" ./build/harness.exe 2>&1 | tee reports/harness.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: reports/
          retention-days: 30
      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-c-${{ matrix.os }}
          path: |
            build/libhelm_c.*
            include/helm_c.h
          if-no-files-found: error

  build-test-windows-llvm:
    # Second Windows toolchain: llvm-mingw (clang targeting mingw-w64), so a
    # regression against either supported toolchain is caught. The MSYS2
    # mingw-w64 gcc build runs in the main matrix.
    runs-on: windows-latest
    env:
      # Pinned llvm-mingw release tag (https://github.com/mstorsjo/llvm-mingw);
      # bump deliberately.
      LLVM_MINGW_VERSION: "20250613"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install llvm-mingw
        shell: bash
        run: |
          curl -sSL -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-x86_64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP/llvm-mingw"
          echo "$RUNNER_TEMP/llvm-mingw/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-x86_64/bin" >> "$GITHUB_PATH"
      - name: Vet + test (cgo via clang)
        shell: bash
        env:
          CC: x86_64-w64-mingw32-clang
        run: |
          mkdir -p reports
          go vet ./...
          go test -v ./... 2>&1 | tee reports/test-results-llvm.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Build library + harness (clang)
        shell: bash
        env:
          CC: x86_64-w64-mingw32-clang
        run: |
          make build
          x86_64-w64-mingw32-clang -Wall -Wextra -Werror -o build/harness.exe \
            test/c-harness/main.c -I include -L build -lhelm_c
          HELMC_TESTCHART=testdata/testchart \
          HELMC_KUBECONFIG=testdata/kubeconfig.yaml \
          HELMC_SIGNING_DIR=testdata/signing \
          PATH="$PWD/build:$PATH" ./build/harness.exe 2>&1 | tee reports/harness-llvm.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows-llvm
          path: reports/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6

  sast:
    # Static analysis: gosec (Go security patterns) + govulncheck (known CVEs
    # reachable from our call graph). Findings land in the Security tab
    # (SARIF) and as downloadable artifacts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gosec (SARIF + text report)
        shell: bash
        run: |
          mkdir -p reports
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out reports/gosec.sarif ./... || true
          gosec -fmt text ./... 2>&1 | tee reports/gosec.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload gosec SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gosec.sarif
          category: gosec
      - name: govulncheck (report)
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... 2>&1 | tee reports/govulncheck.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-sast
          path: reports/
          retention-days: 30

  secrets:
    # Secret scanning over the FULL git history (not just the diff) —
    # leaked-then-deleted credentials are still leaked.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        shell: bash
        run: |
          mkdir -p reports
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --report-format sarif --report-path reports/gitleaks.sarif \
            2>&1 | tee reports/gitleaks.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload secrets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-secrets
          path: reports/
          retention-days: 30

  kind-e2e:
    # Real-cluster end-to-end: install/upgrade/rollback/uninstall against a
    # kind cluster (local tests use the memory driver + fake kube clients).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
      - name: Cluster lifecycle e2e (with report)
        shell: bash
        run: |
          mkdir -p reports
          go test -tags kind -race -v ./internal/wrapper -run TestKind 2>&1 | tee reports/kind-e2e.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-kind-e2e
          path: reports/
          retention-days: 30

  fuzz:
    # Dynamic testing of the untrusted-input parsers. Failing inputs are
    # written to testdata/fuzz/ and uploaded so failures reproduce locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz (strvals, chart archives, values)
        shell: bash
        run: |
          mkdir -p reports
          for target in FuzzParseSetString FuzzLoadArchive FuzzValuesRoundTrip; do
            go test ./internal/wrapper -run '^$' -fuzz "$target" -fuzztime 30s \
              2>&1 | tee -a reports/fuzz.txt
            test "${PIPESTATUS[0]}" -eq 0
          done
      - name: Upload fuzz report (+ any failing inputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-fuzz
          path: |
            reports/
            internal/wrapper/testdata/fuzz/
          retention-days: 30

  leak-check:
    # DAST-equivalent for a native library: the e2e harness under ASan/LSan
    # catches leaks, double-frees, and use-after-free across the FFI seam.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Harness under AddressSanitizer + LeakSanitizer (with report)
        shell: bash
        run: |
          mkdir -p reports
          make leak-check 2>&1 | tee reports/asan-leak-check.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload sanitizer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-leak-check
          path: reports/
          retention-days: 30
